name: CI & Cross-Platform Release

on:
  push:
    branches: [ main, gate/*, release/* ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, gate/* ]

permissions:
  contents: write

jobs:
  lint-and-validate:
    name: Repository Cleanliness & Config Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Clean Repository (Rule 4)
        run: |
          echo "Checking for illegal ROM binaries..."
          if find . -type f \( -name "*.sfc" -o -name "*.smc" -o -name "*.rom" \) | grep -q .; then
            echo "ERROR: Copyrighted ROM file detected in repository!"
            exit 1
          fi

      - name: Validate INI and JSON Configuration Syntax
        run: |
          python3 - <<'PY'
          import os, json, configparser
          for root, _, files in os.walk('.'):
              if '.git' in root:
                  continue
              for f in files:
                  p = os.path.join(root, f)
                  if f.endswith('.json') and not f.endswith('.metadata.json'):
                      with open(p) as fp:
                          json.load(fp)
                  elif f.endswith('.ini'):
                      cp = configparser.ConfigParser()
                      cp.read(p)
          print('All configuration files validated successfully.')
          PY

      - name: Run Area 4 Python Verification Suite
        run: |
          PYTHONPATH=tools python3 -m unittest discover -s tests -p "*.py" -v

  build-and-package:
    name: Build & Test (${{ matrix.os }})
    needs: lint-and-validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: ogre-battle-pc-linux-x64
            archive_ext: tar.gz
          - os: macos-latest
            artifact_name: ogre-battle-pc-macos-universal
            archive_ext: tar.gz
          - os: windows-latest
            artifact_name: ogre-battle-pc-windows-x64
            archive_ext: zip

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch snesrecomp & LakeSnes
        shell: bash
        run: |
          if [ ! -d third_party/snesrecomp ]; then
            mkdir -p third_party
            git clone --recursive https://github.com/sp00nznet/snesrecomp.git third_party/snesrecomp
            git -C third_party/snesrecomp checkout 03bf617
            git -C third_party/snesrecomp submodule update --init --recursive
          fi

      - name: Install SDL2 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - name: Install SDL2 (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2

      - name: Setup MSYS2 & SDL2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL2

      - name: Configure & Build (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4

      - name: Configure & Build (Windows MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4

      - name: Run ROM-Independent Engine CTest Suites (Unix)
        if: runner.os != 'Windows'
        run: |
          ctest --test-dir build -R "Gate2MouseThreePillarTest|Gate3Widescreen16x9Test|Gate5ConfigGuiTest" --output-on-failure

      - name: Run ROM-Independent Engine CTest Suites (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          ctest --test-dir build -R "Gate2MouseThreePillarTest|Gate3Widescreen16x9Test|Gate5ConfigGuiTest" --output-on-failure

      - name: Stage Release Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/${{ matrix.artifact_name }}
          cp build/ogre_battle_pc dist/${{ matrix.artifact_name }}/
          cp -r data dist/${{ matrix.artifact_name }}/
          cp README.md dist/${{ matrix.artifact_name }}/
          tar -czf ${{ matrix.artifact_name }}.tar.gz -C dist ${{ matrix.artifact_name }}

      - name: Stage Release Package (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p dist/${{ matrix.artifact_name }}
          cp build/ogre_battle_pc.exe dist/${{ matrix.artifact_name }}/
          cp /ucrt64/bin/SDL2.dll dist/${{ matrix.artifact_name }}/
          cp -r data dist/${{ matrix.artifact_name }}/
          cp README.md dist/${{ matrix.artifact_name }}/
          (cd dist && cmake -E tar "cf" ../${{ matrix.artifact_name }}.zip --format=zip ${{ matrix.artifact_name }})

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-package
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten Artifacts
        run: |
          mkdir -p release-files
          find release-artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-files/ \;
          ls -lh release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
